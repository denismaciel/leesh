[project]
name = "leesh"
version = "0.21.0"
description = "Strict architecture linting for Python functional cores and imperative shells"
readme = "README.md"
requires-python = ">=3.12"
dependencies = []
authors = [{ name = "Denis Maciel" }]
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.txt"]
keywords = ["lint", "architecture", "static-analysis", "functional-core"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Software Development :: Quality Assurance",
]

[project.urls]
Repository = "https://github.com/denismaciel/lint-it"
Issues = "https://github.com/denismaciel/lint-it/issues"
Changelog = "https://github.com/denismaciel/lint-it/blob/main/CHANGELOG.md"

[project.scripts]
leesh = "leesh._native:main"

[build-system]
requires = ["uv_build==0.12.4"]
build-backend = "build_backend"
backend-path = ["."]

[tool.uv]
required-version = "==0.12.4"
cache-keys = [{ file = "pyproject.toml" }, { file = "build_backend.py" }, { file = "native-artifacts.json" }, { file = "rust/target/release/leesh-rust" }, { env = "LEESH_NATIVE_BINARY" }, { env = "LEESH_NATIVE_TARGET" }]

[tool.uv.build-backend]
module-name = "leesh"
source-include = ["build_backend.py", "rust-toolchain.toml", "rust/src/**", "rust/Cargo.toml", "rust/Cargo.lock", "rust/README.md", "rust/LICENSE*", "tests/**", "docs/**", "benchmarks/**", "native-artifacts.json", "scripts/**", "CHANGELOG.md", "leesh.toml", "uv.lock", ".pre-commit-hooks.yaml"]
source-exclude = ["_bin/**", "**/target/**", "**/__pycache__/**"]

[dependency-groups]
dev = ["uv_build==0.12.4", "pytest>=9,<10", "ruff>=0.16,<1", "ty>=0.0.70"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["leesh"]
