name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Require releases to come from main
        env:
          RELEASE_EVENT: ${{ github.event_name }}
          RELEASE_REF: ${{ github.ref }}
          RELEASE_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "$RELEASE_EVENT" = push ]; then
            test "$RELEASE_REPOSITORY" = denismaciel/lint-it
            [[ "$RELEASE_REF" =~ ^refs/tags/v[0-9]+\.[0-9]+\.[0-9]+$ ]]
            git fetch origin main:refs/remotes/origin/main
            git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
          fi

  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  stage:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
          version: "0.12.4"
          python-version: "3.14"
      - name: Verify provenance and stage the pinned native binaries
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: uv run --no-project python scripts/release.py stage
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-assets
          path: dist/release/*
          if-no-files-found: error

  publish:
    if: github.repository == 'denismaciel/lint-it' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: stage
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: dist
      - name: Publish verified immutable assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cd dist
          sha256sum --check SHA256SUMS
          gh release create "$RELEASE_TAG" ./* --verify-tag --draft --generate-notes
          gh release edit "$RELEASE_TAG" --draft=false

  verify-published:
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e
        with:
          enable-cache: false
          version: "0.12.4"
          python-version: "3.14"
      - name: Verify published Git install without Rust
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: uv run --no-project --isolated --with "leesh @ git+https://github.com/denismaciel/lint-it.git@$RELEASE_TAG" leesh rules

  publish-pypi:
    if: github.repository == 'denismaciel/lint-it' && github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: [stage, publish, verify-published]
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/leesh
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: release-assets
          path: verified-assets
      - name: Verify and select Python distributions
        run: |
          cd verified-assets
          sha256sum --check --strict SHA256SUMS
          mkdir ../dist
          wheels=(*.whl)
          sources=(*.tar.gz)
          test "${#wheels[@]}" -eq 5
          test "${#sources[@]}" -eq 1
          for package in "${wheels[@]}" "${sources[@]}"; do
            test -f "$package"
            grep -Fqx -- "$(sha256sum -- "$package")" SHA256SUMS
            cp -- "$package" ../dist/
          done
      # No checkout, package installation, or builds in the credential-bearing job.
      - name: Publish to PyPI with attestations
        uses: pypa/gh-action-pypi-publish@7245906fb61fa33a13554f9d5fb856fe61758086 # v1.14.3
        with:
          packages-dir: dist/
          attestations: true
