[workspace]
kind = "library"
layout = "leesh"

[conventions]
extend_allowed_bases = ["html.parser.HTMLParser"]

[layouts.leesh]
extends = "flat"
layers = [
  { glob = "build_backend.py", layer = "boundary" },
  { glob = "benchmarks/**/*.py", layer = "test" },
]

[[ignore]]
rules = ["LIT304"]
paths = ["tests/test_launcher.py", "tests/test_packaging.py"]
reason = "Packaging tests isolate exec replacement, host platform detection and release downloads without replacing the test process or using the network."

[[ignore]]
rules = ["LIT303"]
paths = ["src/leesh/_native.py"]
reason = "The native launcher executes the bundled Rust binary via subprocess.run."
